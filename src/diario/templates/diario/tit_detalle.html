{% extends 'diario/base.html' %}

{% block title %}Finper - {{ titular.nombre }}{% endblock title %}

{% block contenido %}
<section class="fp-hero">
  <div class="fp-hero__main">
    <h1 class="fp-hero__title">
      <a href="{{ titular.get_absolute_url }}" class="class_link_titular text-white">
        {{ titular.nombre }}
      </a>
    </h1>
    <div id="id_capital_{{ titular.sk }}" class="fp-hero__amount class_capital_titular">
      {{ titular.capital|floatformat:2 }}
    </div>
  </div>
</section>
{% endblock contenido %}

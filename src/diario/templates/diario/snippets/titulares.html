<section id="id_section_titulares" class="fp-section fp-section--titulares fp-card">
  <div class="fp-card__header">
    <div>
      <h2 class="fp-card__title">Titulares</h2>
      <p class="fp-card__subtitle">Participantes del sistema</p>
    </div>
    <div class="fp-card__actions">
      <a id="id_link_titular_nuevo"
         class="btn btn-sm btn-outline-primary"
         href="{% url 'tit_nuevo' %}?next={{ request.get_full_path }}">
        Nuevo titular
      </a>
    </div>
  </div>

  <div id="id_div_menu_titulares" class="fp-card__body p-0">
    <div class="table-responsive">
      <table class="table table-hover menu mb-0">
        <thead>
          <tr>
            <th>Titular</th>
            <th class="text-right">Capital</th>
            <th class="text-right">Menu</th>
          </tr>
        </thead>
        <tbody>
          {% for tit in titulares %}
            {% include "diario/snippets/titular.html" %}
          {% empty %}
            <tr>
              <td colspan="3" class="fp-empty-state">No hay titulares.</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>

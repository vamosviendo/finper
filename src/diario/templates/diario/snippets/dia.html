{% load saldos %}
{% load movimientos %}

<div class="class_div_dia">
  <div class="class_titulo_dia">
    <div class="fp-day__date">
      <span class="class_span_fecha_dia">{{ dia.str_dia_semana }}</span>
    </div>
    <div class="fp-day__balance">
      Saldo:
      <span class="class_span_saldo_dia">{{ saldos_por_dia|get_item:dia.pk }}</span>
    </div>
  </div>

  <div class="table-responsive">
    <table id="id_table_movimientos_dia_{{ dia.sk }}" class="lista class_table_movimientos table table-sm mb-0">
      <thead id="id_thead_movimientos_dia_{{ dia.sk }}" class="class_thead_movimientos">
        <tr>
          <th id="id_th_orden_dia_{{ dia.sk }}"></th>
          <th id="id_th_concepto_{{ dia.sk }}">Concepto</th>
          <th id="id_th_detalle_{{ dia.sk }}">Detalle</th>
          <th id="id_th_cta_entrada_{{ dia.sk }}">Entra en</th>
          <th id="id_th_cta_salida_{{ dia.sk }}">Sale de</th>
          <th id="id_th_importe_{{ dia.sk }}">Importe</th>
          <th>Menu</th>
        </tr>
      </thead>
      <tbody>
        {% for mov in dia|movs_seleccionados:filtro %}
          {% include "diario/snippets/movimiento.html" %}
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
